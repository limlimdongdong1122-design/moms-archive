name: build-desktop

# 세 OS에서 단일 실행 파일을 빌드해 "다운로드 가능한 아티팩트"로 올린다.
# (이 리눅스 컨테이너에서는 Windows/macOS 바이너리를 만들 수 없어 CI로 처리한다.)
# 실행: 브랜치 푸시 / 태그(v*) / 수동(Run workflow)

on:
  workflow_dispatch:
  push:
    branches: [ "claude/beautiful-bardeen-jpwwsb" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Run tests
        run: |
          python tests/test_collector.py
          python tests/test_server.py

      - name: Generate icons
        run: python tools/make_icons.py server/static/icons

      - name: Build single-file binary
        run: pyinstaller --clean -y bhist.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bhist-${{ matrix.os }}
          path: |
            dist/bhist
            dist/bhist.exe
          if-no-files-found: error
